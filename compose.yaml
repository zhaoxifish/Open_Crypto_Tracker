name: open-crypto-tracker

services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: open-crypto-tracker-local:php8.3
    init: true
    restart: unless-stopped
    depends_on:
      account-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "--silent", "--show-error", "--max-time", "5", "--output", "/dev/null", "https://localhost:8443/templates/interface/media/images/auto-preloaded/bitcoin-btc-logo.png"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: bind
        source: ./cache
        target: /opt/oct-cache-seed
        read_only: true
      # Upstream deletes this Git-only metadata file at runtime; protect the checkout.
      - type: bind
        source: ./.dev-status.json
        target: /var/www/html/.dev-status.json
        read_only: true
      - cache:/var/www/html/cache
      - local-certs:/etc/apache2/local-certs
      - account-data:/var/lib/btc-monitor-account
      - account-key:/var/lib/btc-monitor-account-key:ro

  cron:
    profiles: [cron]
    image: open-crypto-tracker-local:php8.3
    entrypoint: ["/usr/local/bin/oct-cron-loop"]
    user: www-data
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    network_mode: "service:app"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      # Upstream deletes this Git-only metadata file at runtime; protect the checkout.
      - type: bind
        source: ./.dev-status.json
        target: /var/www/html/.dev-status.json
        read_only: true
      - cache:/var/www/html/cache


  # Public BTC/USDT spot monitoring only: no account access or notifications.
  market-monitor:
    profiles: [monitor]
    image: open-crypto-tracker-local:php8.3
    entrypoint: ["php", "/var/www/html/app-lib/binance-monitor/worker.php"]
    user: www-data
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - type: bind
        source: .
        target: /var/www/html
        read_only: true
      - cache:/var/www/html/cache
    healthcheck:
      test: ["CMD", "php", "/var/www/html/app-lib/binance-monitor/worker.php", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 35s

  # Initialize encryption material once, without any network access.
  account-storage-init:
    image: open-crypto-tracker-local:php8.3
    entrypoint: ["/usr/local/bin/oct-account-storage-init"]
    network_mode: none
    read_only: true
    restart: "no"
    volumes:
      - account-data:/var/lib/btc-monitor-account
      - account-key:/var/lib/btc-monitor-account-key

  # Private read-only spot account collector; credentials never enter the public cache.
  account-monitor:
    profiles: [monitor]
    image: open-crypto-tracker-local:php8.3
    entrypoint: ["php", "/var/www/html/app-lib/binance-account/worker.php"]
    user: www-data
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - type: bind
        source: .
        target: /var/www/html
        read_only: true
      - account-data:/var/lib/btc-monitor-account
      - account-key:/var/lib/btc-monitor-account-key:ro
    healthcheck:
      test: ["CMD", "php", "/var/www/html/app-lib/binance-account/worker.php", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 35s

volumes:
  cache:
  local-certs:
  account-data:
  account-key:

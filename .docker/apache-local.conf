ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost:8443/
</VirtualHost>

<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/local-certs/localhost.crt
    SSLCertificateKeyFile /etc/apache2/local-certs/localhost.key

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Runtime configuration and Git metadata must never be web accessible.
    <LocationMatch "(?i)^/(?:\.git|\.docker|\.local)(?:/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)^(?:\..*|(?:docker-)?compose(?:\.[^.]+)?\.ya?ml|Dockerfile|LOCAL_DEVELOPMENT\.md)$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    <FilesMatch "^binance-account(?:-overview)?\.php$">
        AcceptPathInfo Off
        LimitRequestBody 8192
    </FilesMatch>

    # Account URLs omit query strings and referrers from logs, including rejected requests.
    SetEnvIf Request_URI "^/(binance-account\.php|ajax/binance-account(?:-overview)?\.php)(?:/|$)" account_private
    LogFormat "%h %l %u %t \"%m /account-private %H\" %>s %b" account_private
    CustomLog /proc/self/fd/1 combined env=!account_private
    CustomLog /proc/self/fd/1 account_private env=account_private
</VirtualHost>

ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost:8443/
</VirtualHost>

<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/local-certs/localhost.crt
    SSLCertificateKeyFile /etc/apache2/local-certs/localhost.key

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Runtime configuration and Git metadata must never be web accessible.
    <LocationMatch "(?i)^/(?:\.git|\.docker|\.local)(?:/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(?i)^(?:\..*|(?:docker-)?compose(?:\.[^.]+)?\.ya?ml|Dockerfile|LOCAL_DEVELOPMENT\.md)$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
